# Builds the Windows installers and attaches them to a draft GitHub Release
# whenever a version tag (v*) is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Review the draft on the Releases page, then publish it.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VRMA Studio ${{ github.ref_name }}'
          releaseBody: |
            Download the `-setup.exe` installer below to install VRMA Studio on Windows.
          releaseDraft: true
          prerelease: false
